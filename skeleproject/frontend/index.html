<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pose Estimation 3D Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="3d-canvas" style="width: 100%; height: 100%"></canvas>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("3d-canvas") });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Create a simple white sphere geometry for joints
        function createSphere(x, y, z, radius = 0.05) {
            const geometry = new THREE.SphereGeometry(radius);
            const material = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(x, y, z);
            return sphere;
        }

        // Render function to add joints and bones
        function renderPose(landmarks) {
            // Clear previous 3D objects
            while (scene.children.length) {
                scene.remove(scene.children[0]);
            }

            // Render joints as spheres
            landmarks.forEach(lm => {
                const joint = createSphere(lm.x * 2 - 1, -lm.y * 2 + 1, lm.z * 5 - 1);
                scene.add(joint);
            });

            // Optionally, you can connect joints to create bones (not implemented here).
        }

        async function fetchPose(imageData) {
            const response = await fetch("https://your-app.onrender.com/process", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ image: imageData }),
            });

            const data = await response.json();
            renderPose(data);
        }

        // Capture Image from Webcam
        async function captureImage() {
            const video = document.createElement('video');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.play();

            video.onloadeddata = async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg');
                await fetchPose(imageData);
            };
        }

        // Start the webcam capture and pose estimation
        captureImage();

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
